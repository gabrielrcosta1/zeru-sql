name: CI

# Verificação a cada push e PR. Roda só no Linux: tipos, lint e os testes do
# Rust não dependem de plataforma, e um matrix de três sistemas aqui gastaria
# minutos de CI sem descobrir nada a mais. O build real das três plataformas
# acontece no workflow de release.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf

      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Lint do front
        run: npm run lint

      - name: Lint do backend
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Testes
        working-directory: src-tauri
        run: cargo test

      - name: Build do front
        run: npm run build
