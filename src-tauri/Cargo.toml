[package]
name = "zeru-sql"
version = "0.1.0"
description = "Zeru — a modern, AI-native SQL client"
authors = ["Zeru"]
edition = "2021"

[lib]
name = "zeru_sql_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
# Native save dialog: WKWebView ignores `<a download>` on blob URLs, so exports
# have to go through the OS file picker rather than the browser download path.
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
# Relaunch after an update is installed.
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
# Row streaming: sqlx returns `Stream`s, and consuming them needs the combinators.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# AI provider calls. rustls only — no OpenSSL in the build chain.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "mysql",
    "chrono",
    "uuid",
    "json",
    "bigdecimal",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]
